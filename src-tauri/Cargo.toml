[package]
name = "weblogger"
version = "1.2.3"
description = "weBlogger - editor de articulos de blog sobre el entorno n.k-7"
authors = ["Weblackbug"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "weblogger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"
lopdf = { version = "0.36.0", default-features = false }
flate2 = "1.1.11"
jpeg-decoder = { version = "0.3.2", default-features = false }
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
jpeg-encoder = "0.6.1"
