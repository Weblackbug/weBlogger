<!-- =====================================================================
     APLICACION
     ================================================================== -->
<div id="app" class="app-shell" data-dock="right" data-dock-open="true" data-view="library">

  <!-- ---------- barra de menu ---------- -->
  <header id="menubar" class="menubar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24"><use href="#ic-logo"></use></svg>
      <span class="brand-name">we<b>Blogger</b></span>
    </div>
    <nav id="menuRoot" class="menu-root" role="menubar" aria-label="Menu principal"></nav>
    <div class="menubar-right">
      <span id="docName" class="doc-name"></span>
      <span id="dirtyFlag" class="dirty-flag" hidden>&bull; sin guardar</span>
      <button class="icon-btn" type="button" data-action="about" title="Acerca de (F1)" aria-label="Acerca de">
        <svg viewBox="0 0 24 24"><use href="#ic-info"></use></svg>
      </button>
    </div>
  </header>

  <!-- ---------- barra de herramientas ---------- -->
  <div id="toolbar" class="toolbar" role="toolbar" aria-label="Archivo y vista">
    <div class="tool-group">
      <button class="icon-btn" type="button" data-action="new" title="Nuevo artículo (Ctrl+N)"><svg viewBox="0 0 24 24"><use href="#ic-new"></use></svg></button>
      <button class="icon-btn" type="button" data-action="library" title="Biblioteca de artículos (Ctrl+O)"><svg viewBox="0 0 24 24"><use href="#ic-book"></use></svg></button>
      <button class="icon-btn" type="button" data-action="save" title="Guardar (Ctrl+S)"><svg viewBox="0 0 24 24"><use href="#ic-save"></use></svg></button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group only-editor">
      <button class="icon-btn" type="button" data-action="undo" title="Deshacer (Ctrl+Z)"><svg viewBox="0 0 24 24"><use href="#ic-undo"></use></svg></button>
      <button class="icon-btn" type="button" data-action="redo" title="Rehacer (Ctrl+Y)"><svg viewBox="0 0 24 24"><use href="#ic-redo"></use></svg></button>
    </div>
    <span class="tool-sep only-editor"></span>
    <div class="tool-group only-editor">
      <button class="btn btn-ghost" type="button" data-action="preview" title="Ver la página funcionando (F5)"><svg viewBox="0 0 24 24"><use href="#ic-eye"></use></svg> Vista previa</button>
      <button class="icon-btn" type="button" data-action="browser" title="Abrir en el navegador"><svg viewBox="0 0 24 24"><use href="#ic-globe"></use></svg></button>
    </div>
    <span class="tool-sep only-editor"></span>
    <div class="tool-group only-editor" role="group" aria-label="Ancho de la página">
      <button class="icon-btn is-active" type="button" data-action="device:0" data-device="0" title="Ancho de escritorio"><svg viewBox="0 0 24 24"><use href="#ic-monitor"></use></svg></button>
      <button class="icon-btn" type="button" data-action="device:820" data-device="820" title="Ancho de tableta"><svg viewBox="0 0 24 24"><use href="#ic-tablet"></use></svg></button>
      <button class="icon-btn" type="button" data-action="device:390" data-device="390" title="Ancho de móvil"><svg viewBox="0 0 24 24"><use href="#ic-phone"></use></svg></button>
    </div>
    <span class="tool-sep only-editor"></span>
    <div class="tool-group only-editor">
      <button id="pageThemeBtn" class="icon-btn" type="button" data-action="page-theme" title="Ver el artículo en claro u oscuro"><svg viewBox="0 0 24 24"><use href="#ic-moon"></use></svg></button>
      <label id="editLangField" class="tool-field" title="Idioma que estás escribiendo" hidden>
        <svg viewBox="0 0 24 24"><use href="#ic-globe"></use></svg>
        <select id="editLang" aria-label="Idioma de edición"></select>
      </label>
    </div>
    <span class="tool-spacer"></span>
    <div class="tool-group only-editor" role="group" aria-label="Posicion del panel">
      <button class="icon-btn" type="button" data-dock-side="left" title="Panel a la izquierda"><svg viewBox="0 0 24 24"><use href="#ic-dock-left"></use></svg></button>
      <button class="icon-btn" type="button" data-dock-side="right" title="Panel a la derecha"><svg viewBox="0 0 24 24"><use href="#ic-dock-right"></use></svg></button>
      <button class="icon-btn" type="button" data-dock-side="top" title="Panel arriba"><svg viewBox="0 0 24 24"><use href="#ic-dock-top"></use></svg></button>
      <button class="icon-btn" type="button" data-dock-side="bottom" title="Panel abajo"><svg viewBox="0 0 24 24"><use href="#ic-dock-bottom"></use></svg></button>
    </div>
    <button class="icon-btn" type="button" data-action="app-theme" title="Aplicación en claro u oscuro"><svg viewBox="0 0 24 24"><use href="#ic-sun"></use></svg></button>
    <label class="tool-field">
      <svg viewBox="0 0 24 24"><use href="#ic-palette"></use></svg>
      <select id="themeSelect" aria-label="Tema de la aplicación">
        <option value="light">claro</option>
        <option value="dark">oscuro</option>
        <option value="metal">metal</option>
        <option value="blue">azul</option>
      </select>
    </label>
  </div>

  <!-- ---------- cinta de formato de texto ---------- -->
  <div id="ribbon" class="toolbar ribbon is-off" role="toolbar" aria-label="Formato de texto">
    <label class="tool-field" title="Estilo de párrafo">
      <select id="fmtPara" aria-label="Estilo de párrafo">
        <option value="">Estilo…</option>
        <option value="p">Párrafo</option>
        <option value="h2">Título</option>
        <option value="h3">Subtítulo</option>
        <option value="h4">Título menor</option>
        <option value="lead">Entradilla</option>
        <option value="dropcap">Letra capital</option>
        <option value="pull">Cita destacada</option>
        <option value="note">Nota</option>
      </select>
    </label>
    <label class="tool-field" title="Fuente"><select id="fmtFont" aria-label="Fuente"></select></label>
    <div class="tool-field size-field" title="Tamaño de letra en píxeles">
      <button class="glyph-btn" type="button" data-fmt="smaller" title="Más pequeña">A−</button>
      <input id="fmtSize" type="number" min="8" max="200" step="1" aria-label="Tamaño" />
      <button class="glyph-btn" type="button" data-fmt="bigger" title="Más grande">A+</button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group">
      <button class="icon-btn glyph" type="button" data-fmt="bold" title="Negrita (Ctrl+B)"><b>N</b></button>
      <button class="icon-btn glyph" type="button" data-fmt="italic" title="Cursiva (Ctrl+I)"><i>K</i></button>
      <button class="icon-btn glyph" type="button" data-fmt="underline" title="Subrayado (Ctrl+U)"><u>S</u></button>
      <button class="icon-btn glyph" type="button" data-fmt="strike" title="Tachado"><s>T</s></button>
      <button class="icon-btn glyph" type="button" data-fmt="sup" title="Superíndice">x<sup>2</sup></button>
      <button class="icon-btn glyph" type="button" data-fmt="sub" title="Subíndice">x<sub>2</sub></button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group">
      <label class="color-tool" title="Color del texto"><span>A</span><input id="fmtColor" type="color" value="#b85d19" /></label>
      <label class="color-tool hl" title="Resaltado"><span>A</span><input id="fmtHilite" type="color" value="#ffe066" /></label>
      <button class="icon-btn glyph" type="button" data-fmt="nocolor" title="Quitar color y resaltado">A<small>×</small></button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group">
      <button class="icon-btn" type="button" data-fmt="left" title="Alinear a la izquierda"><svg viewBox="0 0 24 24"><use href="#ic-align-left"></use></svg></button>
      <button class="icon-btn" type="button" data-fmt="center" title="Centrar"><svg viewBox="0 0 24 24"><use href="#ic-align-center"></use></svg></button>
      <button class="icon-btn" type="button" data-fmt="right" title="Alinear a la derecha"><svg viewBox="0 0 24 24"><use href="#ic-align-right"></use></svg></button>
      <button class="icon-btn" type="button" data-fmt="justify" title="Justificar"><svg viewBox="0 0 24 24"><use href="#ic-align-justify"></use></svg></button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group">
      <button class="icon-btn" type="button" data-fmt="ul" title="Lista con viñetas"><svg viewBox="0 0 24 24"><use href="#ic-list"></use></svg></button>
      <button class="icon-btn" type="button" data-fmt="ol" title="Lista numerada"><svg viewBox="0 0 24 24"><use href="#ic-list-num"></use></svg></button>
      <button class="icon-btn" type="button" data-fmt="link" title="Enlace (Ctrl+K)"><svg viewBox="0 0 24 24"><use href="#ic-link"></use></svg></button>
    </div>
    <span class="tool-sep"></span>
    <div class="tool-group">
      <button class="icon-btn glyph" type="button" data-fmt="upper" title="Mayúsculas">AA</button>
      <button class="icon-btn glyph" type="button" data-fmt="smallcaps" title="Versalitas">A<small>A</small></button>
    </div>
    <label class="tool-field" title="Interlineado">
      <select id="fmtLine" aria-label="Interlineado">
        <option value="">Interlineado…</option>
        <option value="1">1,0</option>
        <option value="1.15">1,15</option>
        <option value="1.4">1,4</option>
        <option value="1.75">1,75</option>
        <option value="2">2,0</option>
        <option value="2.5">2,5</option>
      </select>
    </label>
    <label class="tool-field" title="Efectos de texto"><select id="fmtFx" aria-label="Efecto de texto"></select></label>
    <div class="tool-group">
      <button class="icon-btn" type="button" data-fmt="symbols" title="Símbolos"><svg viewBox="0 0 24 24"><use href="#ic-symbol"></use></svg></button>
      <button class="icon-btn" type="button" data-fmt="clear" title="Quitar el formato"><svg viewBox="0 0 24 24"><use href="#ic-clear"></use></svg></button>
    </div>
  </div>

  <!-- ---------- area de trabajo ---------- -->
  <main id="workspace" class="workspace">

    <section id="canvas" class="canvas">
      <!-- biblioteca: lo que se ve sin articulo abierto -->
      <div id="library" class="library"></div>

      <!-- la pagina del articulo, con los marcos de seleccion encima -->
      <div id="stage" class="stage" data-device="full" hidden>
        <iframe id="pageFrame" class="page-frame" title="Página del artículo"></iframe>
        <div id="overlay" class="overlay">
          <div id="ovHover" class="ov-hover" hidden></div>
          <div id="ovSel" class="ov-sel" hidden></div>
          <div id="ovDrop" class="ov-drop" hidden></div>
          <div id="ovBar" class="ov-bar" hidden>
            <button id="ovGrip" class="ov-btn grip" type="button" data-free title="Arrastra para mover el bloque"><svg viewBox="0 0 24 24"><use href="#ic-grip"></use></svg></button>
            <span id="ovLabel" class="ov-label"></span>
            <button class="ov-btn" type="button" data-action="sel-parent" title="Seleccionar lo que lo contiene (Esc)"><svg viewBox="0 0 24 24"><use href="#ic-parent"></use></svg></button>
            <button class="ov-btn" type="button" data-free data-action="move:-1" title="Subir (Alt+↑)"><svg viewBox="0 0 24 24"><use href="#ic-up"></use></svg></button>
            <button class="ov-btn" type="button" data-free data-action="move:1" title="Bajar (Alt+↓)"><svg viewBox="0 0 24 24"><use href="#ic-down"></use></svg></button>
            <button class="ov-btn" type="button" data-free data-action="dup" title="Duplicar (Ctrl+D)"><svg viewBox="0 0 24 24"><use href="#ic-copy"></use></svg></button>
            <button class="ov-btn" type="button" data-free data-action="del" title="Eliminar"><svg viewBox="0 0 24 24"><use href="#ic-trash"></use></svg></button>
          </div>
        </div>
      </div>

      <!-- paginas de la publicacion: una pestaña por pagina -->
      <div id="pageBar" class="page-bar" hidden></div>
    </section>

    <!-- barra fina: un clic pliega el panel, arrastrar cambia su ancho -->
    <button id="dockHandle" class="dock-handle" type="button" aria-controls="dock" aria-expanded="true" title="Clic: plegar o desplegar · Arrastrar: cambiar el ancho">
      <span class="dock-handle-grip"></span>
    </button>

    <aside id="dock" class="dock" aria-label="Panel del editor">
      <header class="dock-head">
        <span class="dock-title">Editor</span>
        <div class="dock-sides" role="group" aria-label="Mover panel">
          <button class="icon-btn mini" type="button" data-dock-side="left" title="Izquierda"><svg viewBox="0 0 24 24"><use href="#ic-dock-left"></use></svg></button>
          <button class="icon-btn mini" type="button" data-dock-side="top" title="Arriba"><svg viewBox="0 0 24 24"><use href="#ic-dock-top"></use></svg></button>
          <button class="icon-btn mini" type="button" data-dock-side="bottom" title="Abajo"><svg viewBox="0 0 24 24"><use href="#ic-dock-bottom"></use></svg></button>
          <button class="icon-btn mini" type="button" data-dock-side="right" title="Derecha"><svg viewBox="0 0 24 24"><use href="#ic-dock-right"></use></svg></button>
        </div>
      </header>

      <nav class="dock-tabs" role="tablist">
        <button class="dock-tab is-active" type="button" role="tab" data-tab="blocks">Elementos</button>
        <button class="dock-tab" type="button" role="tab" data-tab="props">Propiedades</button>
        <button class="dock-tab" type="button" role="tab" data-tab="page">Página</button>
        <button class="dock-tab" type="button" role="tab" data-tab="outline">Esquema</button>
        <button class="dock-tab" type="button" role="tab" data-tab="articles">Artículos</button>
      </nav>

      <div class="dock-body">
        <div id="paneBlocks" class="dock-pane is-active" data-pane="blocks"></div>
        <div id="paneProps" class="dock-pane" data-pane="props"></div>
        <div id="panePage" class="dock-pane" data-pane="page"></div>
        <div id="paneOutline" class="dock-pane" data-pane="outline"></div>
        <div id="paneArticles" class="dock-pane" data-pane="articles"></div>
      </div>
    </aside>
  </main>

  <!-- ---------- barra de estado ---------- -->
  <footer class="statusbar">
    <span id="statusMsg" class="status-msg">listo</span>
